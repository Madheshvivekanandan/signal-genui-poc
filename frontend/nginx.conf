server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # An LLM call is slower than nginx's 60s default.
        proxy_read_timeout 120s;

        # The section endpoints are server-sent events. Buffering here would hold
        # every frame until the turn finished, so the UI would jump straight to the
        # final layout and the progressive render would be invisible. The backend
        # also sends X-Accel-Buffering: no; this is the belt to that brace, and it
        # is the one setting that silently breaks streaming.
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable; index.html must never be cached or a
    # deploy leaves clients on a stale bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
